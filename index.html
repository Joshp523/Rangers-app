.list>*{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid #ffffff14;cursor:pointer}
.list>*:hover{background:#ffffff0d}
button.b,label.b{background:var(--noise),linear-gradient(160deg,#d3b873,#a98238 42%,#7a5c22 72%,#b3924a);color:#1d1509;box-shadow:inset 0 1px #fff4,inset 0 -2px #0005,0 1px 2px #000a;border:0;border-radius:999px;padding:7px 16px;font:inherit;font-weight:700;cursor:pointer;display:inline-block}
button.g{background:#0003;border:1px solid var(--brass);color:var(--brass2);border-radius:999px;padding:6px 14px;font:inherit;cursor:pointer}
input,textarea,select{background:#0e1a12;border:1px solid #a9823866;color:var(--ink);border-radius:6px;padding:8px 10px;font:inherit;width:100%}
textarea{min-height:140px}input[type=checkbox]{width:auto}input[type=file]{display:none}
label.f{display:block;margin:10px 0 3px;color:var(--mute);font-size:.9rem}
.card{background:#0e1a1280;border:1px solid #a9823844;border-radius:10px;padding:16px;margin:14px 0}
.tag{display:inline-block;background:var(--moss);border:1px solid var(--brass);border-radius:999px;padding:1px 10px;margin:2px;font-size:.85rem}

// ---------- storage (IndexedDB) ----------
let db;const idb=()=>new Promise((res,rej)=>{if(db)return res(db);const r=indexedDB.open('riley-rangers',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>{db=r.result;res(db)};r.onerror=()=>rej(r.error)});
const kvGet=async k=>{try{const d=await idb();const v=await new Promise(r=>{const q=d.transaction('kv').objectStore('kv').get(k);q.onsuccess=()=>r(q.result);q.onerror=()=>r()});return v&&v.__b?new Blob([v.b],{type:v.t}):v}catch(e){return}};
const kvSet=async(k,v)=>{try{if(v instanceof Blob)v={__b:1,t:v.type,b:await v.arrayBuffer()};const d=await idb();return await new Promise(r=>{const tx=d.transaction('kv','readwrite');tx.objectStore('kv').put(v,k);tx.oncomplete=()=>r(true);tx.onerror=tx.onabort=()=>r(false)})}catch(e){return false}};
const BADGES=[['First Aid','Explain how to assess an emergency scene safely.\nDemonstrate care for cuts, burns, and sprains.\nShow how to treat for shock and heat illness.\nBuild a basic first aid kit for a hike.'],['Sailing','Name the parts of a sailboat.\nTie a bowline, cleat hitch, and figure-eight.\nDemonstrate capsize recovery.\nSail a course on your own with a leader nearby.'],['Camping','Camp out for ten nights over time.\nPlan a menu and pack a kit.\nPitch a tent and manage a campsite.\nPractice Leave No Trace.'],['Hiking','Complete five hikes of at least ten miles.\nPlan a route with map and compass.\nPack the essentials and describe trail safety.'],['Swimming','Pass a swim test.\nDemonstrate several strokes.\nPerform a reaching rescue.\nExplain water safety rules.'],['Sewing','Sew on a button and mend a seam.\nUse a running stitch and a backstitch.\nMake a simple item such as a pouch.'],['Photography','Explain exposure, focus, and composition.\nTake a set of ten photos on an assigned theme.\nPresent your best three to the troop.'],['Singing','Learn three songs from memory.\nLead a song at a campfire.\nSing in a group with a harmony part.'],['Taxonomy','Explain how living things are classified.\nKey out five local plants or insects.\nKeep a field notebook for a season.'],['Survival','Build a shelter from natural materials.\nStart a fire in three ways.\nPurify water.\nSignal for help in three ways.'],['Sharpshooting','Recite and sign range safety rules.\nDemonstrate safe handling under supervision.\nShoot a qualifying group at a supervised range.']];
let S={badges:BADGES.map(b=>({id:'b-'+b[0].toLowerCase().replace(/\W/g,''),name:b[0],reqs:b[1]})),scouts:[],acts:[],docs:[{id:'d-charter',cat:'Founding documents',title:'Troop charter',body:'Edit this page to record why the Riley Rangers were founded.'},{id:'d-summer',cat:'Future plans',title:'Summer campout',body:'Ideas, dates, and gear lists go here.'}],songs:[]};
const KM={badges:'badge',scouts:'scout',acts:'act',docs:'doc',songs:'song',maps:'map'},strip=o=>{const r={...o};delete r.u;return JSON.stringify(r)},seen={},sy={};let base={};
function stamp(){for(const c in KM)for(const it of S[c]||[]){const k=strip(it);if(seen[it.id]!=k){seen[it.id]=k;it.u=Date.now()}}}
const save=()=>{stamp();kvSet('state',S);clearTimeout(sy.t);sy.t=setTimeout(sync,2500)};
let view='home',sel=null,tab='info';
const SEC=['Founding documents','Records','Future plans'];
const urlCache={};const blobUrl=async k=>urlCache[k]||(urlCache[k]=URL.createObjectURL(await kvGet('blob:'+k)));
const go=(v,s=null)=>{view=v;sel=s;tab='info';render()};
// ---------- nav ----------
function nav(){const items=[['home','Library'],['scouts','Scouts'],['acts','Activity log']];
$('#nav').innerHTML='<div class="brand">'+LOGO+'Riley Rangers</div>'+items.map(i=>`<button class="${act(i[0])?'on':''}" onclick="go('${i[0]}')">${i[1]}</button>`).join('')}
async function render(){nav();const m=$('#main');m.scrollTop=0;m.innerHTML=await ({home,badges,music,maps,docs,scouts,acts}[view])();}
// ---------- library ----------
const home=()=>`${hint()}<div id="sy">${syncBar()}</div><h1>The Rangers’ Library</h1><p class="mute">Everything the troop keeps, in one place.</p><div class="grid">
<button class="tile" onclick="go('badges')"><h3>Merit badges</h3><p>${S.badges.length} badges with editable requirements</p></button>
<button class="tile" onclick="go('music')"><h3>Music</h3><p>${S.songs.length} songs, sheet music and recordings</p></button>
<button class="tile" onclick="go('maps')"><h3>Maps</h3><p>${S.maps.length} PDF maps</p></button>
${SEC.map(c=>`<button class="tile" onclick="go('docs','${c}')"><h3>${c}</h3><p>${S.docs.filter(d=>d.cat==c).length} items</p></button>`).join('')}</div>
<div class="card wood row sp"><div><h3>${S.scouts.length} scouts · ${S.acts.length} activities logged</h3></div><button class="b" onclick="go('acts')">Log an activity</button></div>`;
// ---------- merit badges ----------
function badges(){if(sel){const b=S.badges.find(x=>x.id==sel);return `<button class="crumb" onclick="go('badges')">‹ Merit badges</button><h1>${esc(b.name)}</h1>
<label class="f">Name</label><input id="bn" value="${esc(b.name)}"><label class="f">Requirements (one per line)</label><textarea id="br" style="min-height:260px">${esc(b.reqs)}</textarea>
<div class="row" style="margin-top:14px"><button class="b" onclick="saveBadge('${b.id}')">Save badge</button><button class="g" onclick="delBadge('${b.id}')">Delete</button></div>
<h2 style="margin-top:24px">Earned by</h2><p>${S.scouts.filter(s=>s.badges.includes(b.id)).map(s=>`<span class="tag">${esc(s.name)}</span>`).join('')||'<span class="mute">No scouts yet.</span>'}</p>`}
return `${BK}<div class="row sp"><h1>Merit badges</h1><button class="b" onclick="newBadge()">Add badge</button></div><div class="list card">${S.badges.map(b=>`<div onclick="go('badges','${b.id}')"><span>${esc(b.name)}</span><span class="mute">${b.reqs.split('\n').filter(Boolean).length} requirements</span></div>`).join('')}</div><p class="mute">Starter requirements are drafts. Open any badge to rewrite them.</p>`}
function newBadge(){const b={id:uid(),name:'New badge',reqs:''};S.badges.push(b);save();go('badges',b.id)}
function saveBadge(id){const b=S.badges.find(x=>x.id==id);b.name=$('#bn').value;b.reqs=$('#br').value;save();go('badges')}
async function delBadge(id){if(!await askYes('Delete this badge?'))return;S.badges=S.badges.filter(x=>x.id!=id);S.scouts.forEach(s=>s.badges=s.badges.filter(x=>x!=id));save();go('badges')}
// ---------- documents ----------
async function docs(){if(sel&&sel.id){const d=S.docs.find(x=>x.id==sel.id);const link=d.file?`<p><a style="color:var(--brass2)" target="_blank" href="${await blobUrl(d.id)}">Open ${esc(d.file)}</a></p>`:'';
return `<button class="crumb" onclick="go('docs','${d.cat}')">‹ ${d.cat}</button><h1>${esc(d.title)}</h1><label class="f">Title</label><input id="dt" value="${esc(d.title)}"><label class="f">Section</label><select id="dc">${SEC.map(c=>`<option ${c==d.cat?'selected':''}>${c}</option>`).join('')}</select><label class="f">Notes</label><textarea id="db">${esc(d.body)}</textarea>${link}
<div class="row" style="margin-top:14px"><button class="b" onclick="saveDoc('${d.id}')">Save</button><label class="g b" style="background:none;color:var(--brass2);border:1px solid var(--brass)">Attach file<input type="file" onchange="attach('${d.id}',this.files[0])"></label><button class="g" onclick="delDoc('${d.id}')">Delete</button></div>`}
const cat=sel||SEC[0];return `${BK}<div class="row sp"><h1>Documents</h1><button class="b" onclick="newDoc('${cat}')">Add to ${cat.toLowerCase()}</button></div><div class="row" style="margin:12px 0">${SEC.map(c=>`<button class="${c==cat?'b':'g'}" onclick="go('docs','${c}')">${c}</button>`).join('')}</div>
<div class="list card">${S.docs.filter(d=>d.cat==cat).map(d=>`<div onclick="go('docs',{id:'${d.id}'})"><span>${esc(d.title)}</span><span class="mute">${d.file?'📎 ':''}${esc(d.body.slice(0,50))}</span></div>`).join('')||'<p class="mute" style="padding:12px">Nothing here yet. Add the first item.</p>'}</div>`}

const CFG=window.RR_CONFIG||{};let sb=null;

function signIn(){dlg.onclose=null;dlg.innerHTML=`<h3>Sign in</h3><label class="f">Email</label><input id="se" type="email" autocomplete="username"><label class="f">Password</label><input id="sp" type="password" autocomplete="current-password"><p id="sm" class="mute"></p><div class="row" style="justify-content:flex-end"><button class="g" id="dx">Cancel</button><button class="b" id="dk">Sign in</button></div>`;$('#dx').onclick=()=>dlg.close();$('#dk').onclick=async()=>{const {error}=await sb.auth.signInWithPassword({email:$('#se').value.trim(),password:$('#sp').value});if(error){$('#sm').textContent=error.message;return}dlg.close();sync(1)};dlg.showModal();$('#se').focus()}
async function signOut(){await sb.auth.signOut();sy.msg='';bar()}
async function sync(){if(!sb||!sy.user||sy.busy)return;if(!navigator.onLine){sy.msg='Offline. Changes will sync when you reconnect.';bar();return}
sy.busy=1;sy.msg='Syncing…';bar();let changed=false;
try{base=(await kvGet('base'))||{};let last=await kvGet('last');
for(;;){let q=sb.from('rangers_items').select('*').order('synced_at').limit(1000);if(last)q=q.gt('synced_at',last);const {data,error}=await q;if(error)throw error;
for(const r of data){last=r.synced_at;const arr=S[Object.keys(KM).find(c=>KM[c]==r.kind)];if(!arr)continue;const i=arr.findIndex(x=>x.id==r.id),loc=arr[i];
if(loc&&strip(loc)!=(base[r.id]||{}).s&&(loc.u||0)>r.updated_at)continue;
if(r.deleted){if(i>=0){arr.splice(i,1);changed=true}delete base[r.id];delete seen[r.id]}
else{const o={...r.data,id:r.id,u:r.updated_at};if(!loc||strip(loc)!=strip(o))changed=true;i>=0?arr[i]=o:arr.push(o);seen[r.id]=strip(o);base[r.id]={k:r.kind,s:seen[r.id]}}}
if(data.length<1000)break}
const keys=[];S.songs.forEach(s=>{if(s.pdf)keys.push('pdf'+s.id);s.recs.forEach(r=>keys.push(r.id))});S.maps.forEach(m=>keys.push('map'+m.id));S.docs.forEach(d=>{if(d.file)keys.push(d.id)});
const up=new Set(await kvGet('upl')||[]);
for(const k of keys){if(up.has(k))continue;const b=await kvGet('blob:'+k);
if(b){const {error}=await sb.storage.from('rangers-files').upload(k,b,{upsert:true,contentType:b.type||'application/octet-stream'});if(!error)up.add(k)}
else{const {data:d,error}=await sb.storage.from('rangers-files').download(k);if(!error){await kvSet('blob:'+k,d);up.add(k);changed=true}}}
await kvSet('upl',[...up]);
const rows=[],pres=new Set();
for(const c in KM)for(const it of S[c]){pres.add(it.id);if(!base[it.id]||base[it.id].s!=strip(it)){const d={...it};delete d.u;rows.push({id:it.id,kind:KM[c],data:d,deleted:false,updated_at:it.u||0})}}
for(const id in base)if(!pres.has(id))rows.push({id,kind:base[id].k,data:{},deleted:true,updated_at:Date.now()});
for(let i=0;i<rows.length;i+=200){const {error}=await sb.from('rangers_items').upsert(rows.slice(i,i+200));if(error)throw error}
rows.forEach(r=>{if(r.deleted)delete base[r.id];else base[r.id]={k:r.kind,s:strip(r.data)}});
await kvSet('base',base);await kvSet('last',last);await kvSet('state',S);
sy.msg='Synced '+new Date().toLocaleTimeString([],{hour:'numeric',minute:'2-digit'});
if(changed&&!sel&&!/INPUT|TEXTAREA/.test(document.activeElement.tagName))render()
}catch(e){sy.msg='Sync problem: '+(e.message||e)}
sy.busy=0;bar()}

let rdoc,rz=1,obs;if(window.pdfjsLib)pdfjsLib.GlobalWorkerOptions.workerSrc='vendor/pdf.worker.min.js';
async function openPdf(key){const id=key.slice(3),it=S.songs.find(x=>x.id==id)||S.maps.find(x=>x.id==id)||{};$('#rt').textContent=it.title||'';$('#reader').classList.add('on');document.body.classList.add('rd');$('#rs').innerHTML='<p class="mute">Loading…</p>';
let b;try{b=await kvGet('blob:'+key);if(!b)throw new Error('This file is not stored on this phone yet. Upload it again, or sign in and sync.');rdoc=await pdfjsLib.getDocument({data:await b.arrayBuffer()}).promise;rz=1;await layout();$('#rs').focus()}catch(e){$('#rs').innerHTML='<p class="mute">This PDF could not be opened.<br><small>'+esc(e.message||e)+'</small></p>'}}
async function layout(){const sc=$('#rs');sc.innerHTML='';sc.scrollTop=0;obs&&obs.disconnect();const w=Math.min(sc.clientWidth-16,1100)*rz;
obs=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting&&!e.target.d){e.target.d=1;draw(e.target)}else if(!e.isIntersecting&&e.target.d){e.target.d=0;e.target.innerHTML=''}}),{root:sc,rootMargin:'900px'});
for(let i=1;i<=rdoc.numPages;i++){const p=await rdoc.getPage(i),v=p.getViewport({scale:1}),s=w/v.width,d=document.createElement('div');d.className='pg';d.style.width=w+'px';d.style.height=v.height*s+'px';d.p=p;d.s=s;d.n=i;sc.appendChild(d);obs.observe(d)}sc.onscroll()}
async function draw(d){const r=Math.min(devicePixelRatio||1,2.5),v=d.p.getViewport({scale:d.s*r}),c=document.createElement('canvas');c.width=v.width;c.height=v.height;c.style.width='100%';d.appendChild(c);await d.p.render({canvasContext:c.getContext('2d'),viewport:v}).promise}
$('#rs').onscroll=()=>{const sc=$('#rs'),mid=sc.scrollTop+sc.clientHeight/3;let n=1;for(const d of sc.children){if(d.n&&d.offsetTop<=mid)n=d.n}$('#rn').textContent=rdoc?n+' / '+rdoc.numPages:''};
function rzoom(f){const sc=$('#rs'),q=sc.scrollTop/(sc.scrollHeight||1);rz=f?Math.min(3,Math.max(.5,rz*f)):1;layout().then(()=>sc.scrollTop=q*sc.scrollHeight)}
function closeReader(){$('#reader').classList.remove('on');document.body.classList.remove('rd');obs&&obs.disconnect();$('#rs').innerHTML='';rdoc&&rdoc.destroy();rdoc=null}
document.addEventListener('keydown',e=>{if(e.key=='Escape'&&$('#reader').classList.contains('on'))closeReader()});
(async()=>{const s=await kvGet('state');if(s)S=s;S.maps=S.maps||[];for(const c in KM)for(const it of S[c])seen[it.id]=strip(it);initSync();render()})();
